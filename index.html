<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>生日快樂 姐姐 🎂</title>
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,"Helvetica Neue","PingFang TC","Noto Sans TC",system-ui;}
  body{background:linear-gradient(180deg,#fff5f8,#fffdf8);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#4b2a2a;}
  h1{font-size:42px;color:#d63384;text-shadow:0 2px 8px rgba(214,51,132,0.25);margin-bottom:10px;}
  h2{font-size:24px;color:#5b3d3d;margin:8px 0 20px 0;}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;}
  .msg{background:rgba(255,255,255,0.8);border-radius:16px;padding:16px 24px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,0.1);max-width:80%;}
  button{margin-top:20px;padding:10px 20px;font-size:16px;border:none;border-radius:10px;background:#ff69b4;color:white;cursor:pointer;}
  button:hover{background:#ff85c1;}
  footer{position:absolute;bottom:12px;font-size:13px;color:#8a7575;}
</style>
</head>
<body>
<canvas id="fireworks"></canvas>
<div class="msg">
  <h1>🎉 生日快樂 姐姐 🎂</h1>
  <h2>生日快樂，平安喜樂，萬事如意 💖</h2>
  <button onclick="toggleMusic()">🎵 播放 / 暫停 音樂</button>
</div>
<footer>2025年10月25日 · from 弟弟 · 為姐姐獻上最溫暖的祝福 💐</footer>

<audio id="bgm" loop>
  <source src="hpy.mp3" type="audio/mpeg">
</audio>

<script>
const canvas=document.getElementById('fireworks');
const ctx=canvas.getContext('2d');
let w,h;
function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();
let fireworks=[];
function random(min,max){return Math.random()*(max-min)+min;}
class Firework{constructor(){this.reset();}
reset(){this.x=random(0,w);this.y=h;this.targetY=random(h*0.2,h*0.5);this.color=`hsl(${random(0,360)},100%,70%)`;this.size=2;this.speed=random(4,7);this.exploded=false;this.particles=[];}
update(){if(!this.exploded){this.y-=this.speed;if(this.y<=this.targetY){this.explode();}}else{this.particles.forEach(p=>p.update());this.particles=this.particles.filter(p=>p.alpha>0);}}
explode(){this.exploded=true;for(let i=0;i<50;i++){this.particles.push(new Particle(this.x,this.y,this.color));}}
draw(){if(!this.exploded){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fillStyle=this.color;ctx.fill();}else{this.particles.forEach(p=>p.draw());}}}
class Particle{constructor(x,y,color){this.x=x;this.y=y;this.color=color;this.angle=random(0,2*Math.PI);this.speed=random(1,6);this.alpha=1;this.gravity=0.05;}
update(){this.x+=Math.cos(this.angle)*this.speed;this.y+=Math.sin(this.angle)*this.speed+this.gravity;this.alpha-=0.01;}
draw(){ctx.globalAlpha=this.alpha;ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fillStyle=this.color;ctx.fill();ctx.globalAlpha=1;}}
function animate(){ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(0,0,w,h);if(Math.random()<0.05)fireworks.push(new Firework());fireworks.forEach(fw=>{fw.update();fw.draw();});fireworks=fireworks.filter(fw=>!fw.exploded||fw.particles.length>0);requestAnimationFrame(animate);}
animate();
function toggleMusic(){const music=document.getElementById('bgm');if(music.paused)music.play();else music.pause();}
</script>
</body>
</html>
